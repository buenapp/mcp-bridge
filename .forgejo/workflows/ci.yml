name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: FreeBSD
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zig
        run: |
          which zig && zig version || doas pkg install -y zig

      - name: Unit tests (host)
        run: zig build test

      - name: Build (ReleaseSafe, x86_64-windows)
        run: zig build -Doptimize=ReleaseSafe

      - name: Verify binary
        run: |
          file zig-out/bin/mcp-bridge.exe
          ls -la zig-out/bin/mcp-bridge.exe
          readelf -S zig-out/bin/mcp-bridge.exe | grep -i rsrc

      - name: Build (ReleaseSafe, x86_64-freebsd)
        run: |
          zig build -Dtarget=x86_64-freebsd -Doptimize=ReleaseSafe --prefix /tmp/mcp-bridge-fbsd
          file /tmp/mcp-bridge-fbsd/bin/mcp-bridge
          readelf -d /tmp/mcp-bridge-fbsd/bin/mcp-bridge | grep NEEDED

  # Native Linux build + tests on the Ubuntu runner (avoids the
  # Linuxulator: zig deadlocks there on this project's builds).
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      # act containers (node:*-bookworm) lack ca-certificates, and
      # pacyworld.dev is served from the private Pacy World Root CA —
      # install both before git over HTTPS can work (must precede
      # actions/checkout).
      - name: Bootstrap CA certificates
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq ca-certificates curl xz-utils
          $SUDO tee /usr/local/share/ca-certificates/pacyworld-root.crt > /dev/null <<'EOF'
