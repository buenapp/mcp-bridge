          EOF
          $SUDO update-ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zig 0.15.2 + OpenSSL headers
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
          curl -fsSLo /tmp/zig.tar.xz https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          echo "02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  /tmp/zig.tar.xz" | sha256sum -c -
          $SUDO tar -xf /tmp/zig.tar.xz -C /opt
          $SUDO ln -sf /opt/zig-x86_64-linux-0.15.2/zig /usr/local/bin/zig
          $SUDO apt-get install -y -qq libssl-dev
          zig version

      - name: Unit tests
        run: zig build test

      - name: Build (ReleaseSafe, native)
        run: zig build -Dtarget=native -Doptimize=ReleaseSafe

      # PKI positive against a public host, fail-closed against a local
      # self-signed server. DANE-positive E2E needs a TLSA-publishing host
      # and stays a manual/internal test (memory.morante.com is internal
      # and production — do NOT use it in CI).
      - name: Smoke test (PKI fallback + fail-closed)
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
          $SUDO apt-get install -y -qq openssl
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | ./zig-out/bin/mcp-bridge https://github.com/mcp --verbose 2>&1 | grep -q "certificate accepted"
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/ssk.pem -out /tmp/ssc.pem -days 1 -nodes -subj "/CN=localhost" 2>/dev/null
          openssl s_server -www -accept 24431 -cert /tmp/ssc.pem -key /tmp/ssk.pem & SRV=$!
          sleep 1
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | ./zig-out/bin/mcp-bridge https://localhost:24431/ 2>&1 | grep -q "PkiValidationFailed"
          kill $SRV 2>/dev/null || true
