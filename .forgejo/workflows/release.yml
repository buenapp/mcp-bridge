          EOF
          $SUDO update-ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zig 0.15.2 + build tools
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
          curl -fsSLo /tmp/zig.tar.xz https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          echo "02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  /tmp/zig.tar.xz" | sha256sum -c -
          $SUDO tar -xf /tmp/zig.tar.xz -C /opt
          $SUDO ln -sf /opt/zig-x86_64-linux-0.15.2/zig /usr/local/bin/zig
          $SUDO apt-get install -y -qq libssl-dev rpm dpkg
          zig version

      - name: Unit tests
        run: zig build test

      - name: Build (ReleaseSafe, native)
        run: zig build -Dtarget=native -Doptimize=ReleaseSafe

      # DANE positive via the long-standing public DANE test host
      # (www.huque.com publishes TLSA on 443), PKI positive via github.com,
      # fail-closed against a local self-signed server. Do NOT add internal
      # production hosts here — CI runners are outside the internal network.
      - name: Smoke test (DANE + PKI fallback + fail-closed)
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
          $SUDO apt-get install -y -qq openssl
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | ./zig-out/bin/mcp-bridge https://www.huque.com/ --verbose 2>&1 | grep -q "DANE result: success"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | ./zig-out/bin/mcp-bridge https://github.com/mcp --verbose 2>&1 | grep -q "certificate accepted"
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/ssk.pem -out /tmp/ssc.pem -days 1 -nodes -subj "/CN=localhost" 2>/dev/null
          openssl s_server -www -accept 24431 -cert /tmp/ssc.pem -key /tmp/ssk.pem & SRV=$!
          sleep 1
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | ./zig-out/bin/mcp-bridge https://localhost:24431/ 2>&1 | grep -q "PkiValidationFailed"
          kill $SRV 2>/dev/null || true

      - name: Build .deb package
        run: |
          TAG="${GITHUB_REF_NAME:-dev}"
          VERSION="${TAG#v}"
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/pkg/DEBIAN" "$STAGE/pkg/usr/bin"
          cp zig-out/bin/mcp-bridge "$STAGE/pkg/usr/bin/mcp-bridge"
          chmod 755 "$STAGE/pkg/usr/bin/mcp-bridge"
          {
            echo "Package: mcp-bridge"
            echo "Version: $VERSION"
            echo "Architecture: amd64"
            echo "Maintainer: Daniel Morante <daniel@morante.net>"
            echo "Depends: libssl3t64 | libssl3"
            echo "Homepage: https://pacyworld.dev/buenapp/mcp-bridge"
            echo "Description: MCP stdio to HTTP(S) bridge with DANE TLSA verification"
            echo " Connects stdio-only MCP clients to remote MCP servers over HTTP(S)"
            echo " Streamable HTTP transport with DANE TLSA verification and OAuth 2.1."
          } > "$STAGE/pkg/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$STAGE/pkg" "mcp-bridge_${VERSION}_amd64.deb"
          dpkg-deb --info "mcp-bridge_${VERSION}_amd64.deb"
          rm -rf "$STAGE"

      - name: Build .rpm package
        run: |
          TAG="${GITHUB_REF_NAME:-dev}"
          VERSION="${TAG#v}"
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/BUILD" "$STAGE/RPMS" "$STAGE/SOURCES" "$STAGE/SPECS" "$STAGE/BUILDROOT/pkg/usr/bin"
          cp zig-out/bin/mcp-bridge "$STAGE/BUILDROOT/pkg/usr/bin/mcp-bridge"
          chmod 755 "$STAGE/BUILDROOT/pkg/usr/bin/mcp-bridge"
          {
            echo "Name: mcp-bridge"
            echo "Version: $VERSION"
            echo "Release: 1%{?dist}"
            echo "Summary: MCP stdio to HTTP(S) bridge with DANE TLSA verification"
            echo "License: BSD-2-Clause"
            echo "URL: https://pacyworld.dev/buenapp/mcp-bridge"
            echo "Requires: openssl-libs"
            echo ""
            echo "%description"
            echo "Connects stdio-only MCP clients to remote MCP servers over HTTP(S)"
            echo "Streamable HTTP transport with DANE TLSA verification and OAuth 2.1."
            echo ""
            echo "%install"
            echo "mkdir -p %{buildroot}/usr/bin"
            echo "install -m 755 $STAGE/BUILDROOT/pkg/usr/bin/mcp-bridge %{buildroot}/usr/bin/mcp-bridge"
            echo ""
            echo "%files"
            echo "/usr/bin/mcp-bridge"
          } > "$STAGE/SPECS/mcp-bridge.spec"
          rpmbuild --define "_topdir $STAGE" -bb "$STAGE/SPECS/mcp-bridge.spec"
          find "$STAGE/RPMS" -name "*.rpm" -exec cp {} . \;
          rm -rf "$STAGE"

      - name: Verify packages install (smoke)
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
          TAG="${GITHUB_REF_NAME:-dev}"
          VERSION="${TAG#v}"
          $SUDO dpkg -i "mcp-bridge_${VERSION}_amd64.deb"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | /usr/bin/mcp-bridge https://github.com/mcp --verbose 2>&1 | grep -q "certificate accepted"
          $SUDO dpkg -r mcp-bridge

      - name: Upload Linux packages to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO="$GITHUB_REPOSITORY"
          BASE_URL="$GITHUB_SERVER_URL/api/v1/repos/$REPO"
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          AUTH="Authorization: token $FORGEJO_TOKEN"

          RESP=$(curl -s -H "$AUTH" "$BASE_URL/releases/tags/$TAG")
          RELEASE_ID=$(echo "$RESP" | grep -o '"id":[0-9]*' | head -1 | grep -o '[0-9]*' || true)
          if [ -z "$RELEASE_ID" ]; then
            echo "ERROR: release for $TAG not found"
            exit 1
          fi

          RPMF=$(ls mcp-bridge-${VERSION}-*.rpm | head -1)
          for f in "mcp-bridge_${VERSION}_amd64.deb" "$RPMF"; do
            curl -s -X POST -H "$AUTH" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "$BASE_URL/releases/$RELEASE_ID/assets?name=$f"
            echo "Uploaded $f"
          done
