name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  LINUX_JAIL: linux-build-${{ github.run_id }}
  JAIL_ROOT: /usr/local/jails

jobs:
  build-and-release:
    runs-on: FreeBSD
    steps:
      - name: Checkout
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -rf ./* ./.??*
          curl -sLo repo.tar.gz "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/archive/$GITHUB_REF_NAME.tar.gz"
          tar xf repo.tar.gz --strip-components=1
          rm repo.tar.gz

      # --- Cross-compile with zig (directly on host) ---
      - name: Install zig
        run: |
          which zig && zig version || doas pkg install -y zig

      - name: Unit tests (host)
        run: zig build test

      - name: Build mcp-bridge.exe (ReleaseSafe)
        run: |
          zig build -Doptimize=ReleaseSafe
          file zig-out/bin/mcp-bridge.exe
          ls -l zig-out/bin/mcp-bridge.exe

      - name: Build mcp-bridge (FreeBSD, ReleaseSafe)
        run: |
          zig build -Dtarget=x86_64-freebsd -Doptimize=ReleaseSafe --prefix "$GITHUB_WORKSPACE/dist-freebsd"
          file dist-freebsd/bin/mcp-bridge
          # Must link BASE OpenSSL (certctl trust), never ports libssl.so.12
          readelf -d dist-freebsd/bin/mcp-bridge | grep NEEDED
          ! readelf -d dist-freebsd/bin/mcp-bridge | grep -q "libssl.so.12"

      # --- Authenticode signing (osslsigncode, FreeBSD native) ---
      - name: Install osslsigncode
        run: |
          which osslsigncode || doas pkg install -y osslsigncode

      - name: Sign mcp-bridge.exe
        env:
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
          SIGN_PFX_B64: ${{ secrets.SIGN_PFX_B64 }}
        run: |
          doas pkg install -y osslsigncode

          PFXFILE=$(mktemp /tmp/mcp-bridge-sign.XXXXXX)
          trap 'rm -f "$PFXFILE"' EXIT
          printf '%s' "$SIGN_PFX_B64" | base64 -d > "$PFXFILE"

          osslsigncode sign -pkcs12 "$PFXFILE" -pass "$SIGN_PFX_PASSWORD" \
            -h sha256 -n "MCP Bridge" \
            -i "https://pacyworld.dev/buenapp/mcp-bridge" \
            -t http://timestamp.digicert.com \
            -in zig-out/bin/mcp-bridge.exe -out mcp-bridge-signed.exe
          osslsigncode verify mcp-bridge-signed.exe
          mv mcp-bridge-signed.exe zig-out/bin/mcp-bridge.exe

      # --- Linux jail: build NSIS installer (no FreeBSD nsis package) ---
      - name: Provision Linux jail
        run: |
          JAIL="$LINUX_JAIL"
          JPATH="$JAIL_ROOT/$JAIL"
          TMPBASE="/tmp/linux-rootfs-ubuntu-24.04.4.tar.gz"

          doas kldload linux64 2>/dev/null || true
          doas kldload linux_common 2>/dev/null || true

          if [ ! -f "$TMPBASE" ]; then
            echo "==> Fetching Ubuntu 24.04 rootfs..."
            curl -fSL -o "$TMPBASE" "https://cdimage.ubuntu.com/ubuntu-base/releases/noble/release/ubuntu-base-24.04.4-base-amd64.tar.gz"
          fi

          doas mkdir -p "$JPATH"
          doas tar -xf "$TMPBASE" -C "$JPATH"
          doas cp /etc/resolv.conf "$JPATH/etc/resolv.conf"

          doas mkdir -p "$JPATH/proc" "$JPATH/sys" "$JPATH/dev/shm"
          doas mount -t linprocfs linprocfs "$JPATH/proc"
          doas mount -t linsysfs linsysfs "$JPATH/sys"
          doas mount -t devfs devfs "$JPATH/dev"
          doas mount -t tmpfs tmpfs "$JPATH/dev/shm"

          doas jail -c name="$JAIL" path="$JPATH" ip4=inherit ip6=inherit \
            host.hostname="$JAIL" allow.raw_sockets=1 linux=new persist

          doas jexec "$JAIL" sh -c 'echo "APT::Cache-Start \"100000000\";" > /etc/apt/apt.conf.d/99cache'
          doas jexec "$JAIL" apt-get update -qq
          doas jexec "$JAIL" apt-get install -y -qq nsis libssl-dev

      - name: Build NSIS installer
        run: |
          JPATH="$JAIL_ROOT/$LINUX_JAIL"
          TAG="${GITHUB_REF_NAME:-dev}"
          VERSION="${TAG#v}"

          doas mkdir -p "$JPATH/tmp/build"
          doas cp zig-out/bin/mcp-bridge.exe "$JPATH/tmp/build/"
          doas cp assets/mcp-bridge.ico "$JPATH/tmp/build/"
          doas cp installer/mcp-bridge.nsi "$JPATH/tmp/build/"
          doas cp README.md "$JPATH/tmp/build/"

          doas jexec "$LINUX_JAIL" sh -c \
            "cd /tmp/build && makensis -DVERSION=${VERSION} -DOUTFILE=mcp-bridge-${VERSION}-setup.exe mcp-bridge.nsi"

          cp "$JPATH/tmp/build/mcp-bridge-${VERSION}-setup.exe" .
          file "mcp-bridge-${VERSION}-setup.exe"
          ls -l "mcp-bridge-${VERSION}-setup.exe"

      # --- Linux binary: cross-build on host (zig deadlocks under the
      # Linuxulator), using the jail's libssl-dev as the OpenSSL sysroot ---
      - name: Build mcp-bridge (Linux x86_64, ReleaseSafe)
        run: |
          JPATH="$JAIL_ROOT/$LINUX_JAIL"
          SYSROOT="$GITHUB_WORKSPACE/.sysroot/ubuntu-24.04"
          mkdir -p "$SYSROOT/include" "$SYSROOT/lib"
          cp -r "$JPATH/usr/include/openssl" "$SYSROOT/include/"
          cp -r "$JPATH/usr/include/x86_64-linux-gnu/openssl/." "$SYSROOT/include/openssl/"
          cp -L "$JPATH/usr/lib/x86_64-linux-gnu/libssl.so" "$SYSROOT/lib/"
          cp -L "$JPATH/usr/lib/x86_64-linux-gnu/libcrypto.so" "$SYSROOT/lib/"

          zig build -Dtarget=x86_64-linux-gnu -Doptimize=ReleaseSafe --prefix "$GITHUB_WORKSPACE/dist-linux"
          file dist-linux/bin/mcp-bridge
          readelf -d dist-linux/bin/mcp-bridge | grep NEEDED
          readelf -d dist-linux/bin/mcp-bridge | grep -q "libssl.so.3"

          # Smoke test the Linux binary inside the jail
          cp dist-linux/bin/mcp-bridge "$JPATH/tmp/"
          doas jexec "$LINUX_JAIL" /tmp/mcp-bridge 2>&1 | head -2 || true

      # --- FreeBSD .pkg (hand-rolled manifest; poudriere builds the ports-
      # tree package separately) ---
      - name: Build FreeBSD package (.pkg)
        run: |
          TAG="${GITHUB_REF_NAME:-dev}"
          VERSION="${TAG#v}"
          STAGE=$(mktemp -d /tmp/mcp-bridge-pkg.XXXXXX)
          mkdir -p "$STAGE/usr/local/bin"
          cp dist-freebsd/bin/mcp-bridge "$STAGE/usr/local/bin/mcp-bridge"
          chmod 555 "$STAGE/usr/local/bin/mcp-bridge"
          {
            echo "name: mcp-bridge"
            echo "version: $VERSION"
            echo "origin: net/mcp-bridge"
            echo "comment: MCP stdio to HTTP(S) bridge with DANE TLSA verification"
            echo "maintainer: daniel@morante.net"
            echo "www: https://pacyworld.dev/buenapp/mcp-bridge"
            echo "abi: FreeBSD:15:amd64"
            echo "prefix: /usr/local"
            echo "desc: MCP stdio bridge: connects stdio-only MCP clients to remote MCP servers over HTTP(S) Streamable HTTP transport with DANE TLSA verification and OAuth 2.1 support."
          } > "$STAGE/+MANIFEST"
          echo "bin/mcp-bridge" > "$STAGE/plist"
          mkdir -p dist-pkg
          pkg create -m "$STAGE" -p "$STAGE/plist" -r "$STAGE" -o dist-pkg
          ls -l dist-pkg/
          rm -rf "$STAGE"

      - name: Tear down Linux jail
        if: always()
        run: |
          JPATH="$JAIL_ROOT/$LINUX_JAIL"
          doas jail -r "$LINUX_JAIL" 2>/dev/null || true
          doas umount "$JPATH/dev/shm" 2>/dev/null || true
          doas umount "$JPATH/dev" 2>/dev/null || true
          doas umount "$JPATH/sys" 2>/dev/null || true
          doas umount "$JPATH/proc" 2>/dev/null || true
          if [ -d "$JPATH" ]; then
            doas chflags -R noschg "$JPATH" 2>/dev/null || true
            doas rm -rf "$JPATH"
          fi

      - name: Sign installer
        env:
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
          SIGN_PFX_B64: ${{ secrets.SIGN_PFX_B64 }}
        run: |
          TAG="${GITHUB_REF_NAME:-dev}"
          VERSION="${TAG#v}"
          PFXFILE=$(mktemp /tmp/mcp-bridge-sign.XXXXXX)
          trap 'rm -f "$PFXFILE"' EXIT
          printf '%s' "$SIGN_PFX_B64" | base64 -d > "$PFXFILE"
          osslsigncode sign -pkcs12 "$PFXFILE" -pass "$SIGN_PFX_PASSWORD" \
            -h sha256 -n "MCP Bridge Installer" \
            -i "https://pacyworld.dev/buenapp/mcp-bridge" \
            -t http://timestamp.digicert.com \
            -in "mcp-bridge-${VERSION}-setup.exe" -out "mcp-bridge-${VERSION}-setup-signed.exe"
          osslsigncode verify "mcp-bridge-${VERSION}-setup-signed.exe"
          mv "mcp-bridge-${VERSION}-setup-signed.exe" "mcp-bridge-${VERSION}-setup.exe"

      # --- Publish Forgejo release (only on tag push) ---
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO="$GITHUB_REPOSITORY"
          BASE_URL="$GITHUB_SERVER_URL/api/v1/repos/$REPO"
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          AUTH="Authorization: token $FORGEJO_TOKEN"

          # Detect pre-release (rc, alpha, beta suffixes)
          PRERELEASE=false
          case "$VERSION" in *-rc*|*-alpha*|*-beta*) PRERELEASE=true ;; esac

          # Delete existing release for this tag if present
          RESP=$(curl -s -H "$AUTH" "$BASE_URL/releases/tags/$TAG")
          EXISTING_ID=$(echo "$RESP" | grep -o '"id":[0-9]*' | head -1 | grep -o '[0-9]*' || true)
          if [ -n "$EXISTING_ID" ]; then
            curl -s -X DELETE -H "$AUTH" "$BASE_URL/releases/$EXISTING_ID"
            echo "Deleted existing release $EXISTING_ID"
          fi

          # Create release
          RESP=$(curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"## MCP Bridge $TAG\\n\\nCommit: $GITHUB_SHA\\n\\n### Downloads\\n- **mcp-bridge-${VERSION}-setup.exe** — Windows installer (per-user, no admin)\\n- **mcp-bridge-${VERSION}.exe** — standalone Windows binary\\n- **mcp-bridge-${VERSION}-x86_64-freebsd** — FreeBSD binary (base OpenSSL, certctl trust)\\n- **mcp-bridge-${VERSION}-x86_64-linux** — Linux binary (glibc, distro OpenSSL 3)\\n\\nWindows assets are Authenticode-signed.\",\"draft\":false,\"prerelease\":$PRERELEASE}" \
            "$BASE_URL/releases")
          echo "Create release response: $RESP"
          RELEASE_ID=$(echo "$RESP" | grep -o '"id":[0-9]*' | head -1 | grep -o '[0-9]*')
          if [ -z "$RELEASE_ID" ]; then
            echo "ERROR: Failed to create release"
            exit 1
          fi
          echo "Created release $RELEASE_ID"

          # Upload installer
          curl -s -X POST -H "$AUTH" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@mcp-bridge-${VERSION}-setup.exe" \
            "$BASE_URL/releases/$RELEASE_ID/assets?name=mcp-bridge-${VERSION}-setup.exe"
          echo "Uploaded installer"

          # Upload standalone binary
          curl -s -X POST -H "$AUTH" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @zig-out/bin/mcp-bridge.exe \
            "$BASE_URL/releases/$RELEASE_ID/assets?name=mcp-bridge-${VERSION}.exe"
          echo "Uploaded standalone binary"

          # Upload FreeBSD + Linux binaries
          curl -s -X POST -H "$AUTH" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @dist-freebsd/bin/mcp-bridge \
            "$BASE_URL/releases/$RELEASE_ID/assets?name=mcp-bridge-${VERSION}-x86_64-freebsd"
          echo "Uploaded FreeBSD binary"
          curl -s -X POST -H "$AUTH" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @dist-linux/bin/mcp-bridge \
            "$BASE_URL/releases/$RELEASE_ID/assets?name=mcp-bridge-${VERSION}-x86_64-linux"
          echo "Uploaded Linux binary"

          # Upload FreeBSD package
          PKGF=$(ls dist-pkg/mcp-bridge-*.pkg | head -1)
          curl -s -X POST -H "$AUTH" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$PKGF" \
            "$BASE_URL/releases/$RELEASE_ID/assets?name=mcp-bridge-${VERSION}-x86_64-freebsd.pkg"
          echo "Uploaded FreeBSD package"

  # --- Native Linux build + .deb + .rpm on the Ubuntu runner ---
  # (zig deadlocks under the FreeBSD Linuxulator, so Linux builds run
  # natively here instead of in the jail.)
  linux-packages:
    runs-on: ubuntu-24.04
    # node:24-trixie (glibc 2.41) so the glibc-2.39-pinned binary can run
    # for the smoke test; the act default (bookworm, glibc 2.36) is too old.
    container: node:24-trixie
    needs: build-and-release
    steps:
      # act containers (node:*-bookworm) lack ca-certificates, and
      # pacyworld.dev is served from the private Pacy World Root CA —
      # install both before git over HTTPS can work (must precede
      # actions/checkout).
      - name: Bootstrap CA certificates
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq ca-certificates curl xz-utils
          $SUDO tee /usr/local/share/ca-certificates/pacyworld-root.crt > /dev/null <<'EOF'
          -----BEGIN CERTIFICATE-----
          MIIGDDCCA/SgAwIBAgIJAPjlE9EKnbAtMA0GCSqGSIb3DQEBCwUAMIGSMQswCQYD
          VQQGEwJVUzEQMA4GA1UECAwHRmxvcmlkYTEPMA0GA1UEBwwGTmFwbGVzMSkwJwYD
          VQQKDCBUaGUgRGFuaWVsIE1vcmFudGUgQ29tcGFueSwgSW5jLjEYMBYGA1UECwwP
          UGFjeSBXb3JsZCwgTExDMRswGQYDVQQDDBJQYWN5IFdvcmxkIFJvb3QgQ0EwHhcN
          MTgwNzA3MTczNDAxWhcNMzgwNzAyMTczNDAxWjCBkjELMAkGA1UEBhMCVVMxEDAO
          BgNVBAgMB0Zsb3JpZGExDzANBgNVBAcMBk5hcGxlczEpMCcGA1UECgwgVGhlIERh
          bmllbCBNb3JhbnRlIENvbXBhbnksIEluYy4xGDAWBgNVBAsMD1BhY3kgV29ybGQs
          IExMQzEbMBkGA1UEAwwSUGFjeSBXb3JsZCBSb290IENBMIICIjANBgkqhkiG9w0B
          AQEFAAOCAg8AMIICCgKCAgEAxcG5VqHdWQ00Av5k8qQRtYit6ihHNCRBrOQqvrNV
          V2pTaDgTc3HjgDhb3KtZpV/63EwTGkg2M+amm4XkCcwI2STiTLzKZ+wmuYf9/udQ
          tjw5Br0p3T2c9HvZauNqzZ9L3e0HiI5+F4GI7rAjuRNU5oxD8MrfGXap6JgV8V8o
          1bNkRI9xCYg2ZGCvJLWGBJK0fKxbl6N7A2Vh4FM4VzjMBxElUBYn4iazsyqsmfY0
          eN1Ln6Yg64n34xYSPuJyEzhSbxLS0wMQO5N3d7UrYcK7REE/PR3lM8naqb/MWN6l
          AeEB2cH138x1tPQywAk4BGWNaPndrCRnCFXkoianMgj2PztDKa5gk6l9WqSmwo8M
          FlNhKknYWoaQ75Wz16goG3w1bkWDB/Wc5G+5GC2LD/WZNHAR6rA0tOK785pE/Lmb
          aWhyqhndMTfRlaAlzEblzAoZX+sSB5ocs0AXf3e1EwV22E3UH+cghORp7z1CfbQI
          vGF7fNG8c8tTzrgV9ifEphmZtDRrmtcbYYXJubdEKZmxahDN7QjVEnkXrdsuc8b7
          Egz+KetGjj6n0tIRWCCxrIz9kOf652TBlJc/AWCnzDLgqv+CSw+Wrmm92dGfSgI4
          W3todx0BW1XdMldbmB3Afo5o5gfc77QIcwSVSYJByiZDvkj9OPC48Hf1/1uGoe+r
          4FsCAwEAAaNjMGEwHQYDVR0OBBYEFHoERjvfovVsJyua3AVoSD3edl25MB8GA1Ud
          IwQYMBaAFHoERjvfovVsJyua3AVoSD3edl25MA8GA1UdEwEB/wQFMAMBAf8wDgYD
          VR0PAQH/BAQDAgGGMA0GCSqGSIb3DQEBCwUAA4ICAQAe3IsTEblRYEGY/MICG8cg
